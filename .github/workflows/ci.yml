name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No service keys: the smoke tests cover what visitors see without Supabase, Stripe or Brevo.
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Database tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A throwaway Supabase on the runner, built from supabase/migrations and supabase/seed.sql.
      # It is never linked to the live project, and tests/db/env.ts refuses anything that isn't local.
      # The tests read its keys with `supabase status` (tests/db/env.ts).
      - run: npm run db:start
      # RLS, booking conflicts, payments and Viber access, straight in SQL, on the fresh database.
      - run: npm run db:checks
      - run: npx playwright install --with-deps chromium
      - run: npm run test:db:build
      - run: npm run test:db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-db
          path: playwright-report-db/
          retention-days: 7
